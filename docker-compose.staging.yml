services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: review_defense_staging
      POSTGRES_USER: review_defense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - review_defense_staging_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review_defense -d review_defense_staging"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    environment:
      REVIEW_DEFENSE_ENV: production
      HOST: 0.0.0.0
      PORT: ${PORT:-8080}
      TRUST_PROXY: "true"
      SECURE_HEADERS: "true"
      DATABASE_URL: postgresql://review_defense:${POSTGRES_PASSWORD}@postgres:5432/review_defense_staging
      REVIEW_DEFENSE_PUBLIC_BASE_URL: ${REVIEW_DEFENSE_PUBLIC_BASE_URL:?set REVIEW_DEFENSE_PUBLIC_BASE_URL}
      REVIEW_DEFENSE_MFA_ENCRYPTION_KEY: ${REVIEW_DEFENSE_MFA_ENCRYPTION_KEY:?set REVIEW_DEFENSE_MFA_ENCRYPTION_KEY}
    expose:
      - "${PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "python scripts/migrate.py && gunicorn --bind 0.0.0.0:${PORT:-8080} --workers 2 --threads 4 --timeout 60 wsgi:app"]
  caddy:
    image: caddy:2-alpine
    environment:
      TLS_ADMIN_EMAIL: ${TLS_ADMIN_EMAIL:?set TLS_ADMIN_EMAIL}
      REVIEW_DEFENSE_DOMAIN: ${REVIEW_DEFENSE_DOMAIN:?set REVIEW_DEFENSE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  review_defense_staging_pg:
  caddy_data:
  caddy_config:
