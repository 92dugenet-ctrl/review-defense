<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>About</title><style>
.rd-top{height:62px;display:flex;align-items:center;gap:34px;padding:0 3.1vw;border-bottom:1px solid #eee;background:rgba(255,255,255,.96);position:sticky;top:0;z-index:30;backdrop-filter:blur(14px)}
.rd-brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;white-space:nowrap}.rd-mark{color:#0869ff;font-size:22px;line-height:1}
.rd-nav{display:flex;align-items:center;gap:31px;flex:1;font-size:13px}.rd-nav a{transition:color .2s}.rd-nav a:hover{color:#0869ff}
.rd-actions{display:flex;align-items:center;gap:14px}.rd-search{font-size:22px}.rd-btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:11px 20px;font-size:12px;font-weight:700}.rd-btn-blue{background:#0869ff;color:#fff}.rd-menu{display:none;border:0;background:none;font-size:23px}
@media(max-width:900px){.rd-nav,.rd-actions{display:none}.rd-menu{display:block;margin-left:auto}.rd-top{gap:14px}}
@media(max-width:580px){.rd-top{height:58px;padding:0 20px}}
</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&display=swap');
body,button,input,textarea,select{font-family:'Oswald',Arial,sans-serif!important;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5,h6,p,a,button,label,small,strong,b,summary,input,textarea,select{font-weight:400!important;text-transform:none!important}
h1,h2,h3,h4,h5,h6{letter-spacing:-.018em!important;line-height:1.08!important}
.rd-hero h1,.hero h1{font-size:clamp(42px,5vw,64px)!important;font-weight:400!important;letter-spacing:-.02em!important}
.rd-intro h2,.rd-responsible h2,.rd-final h2,.rd-section-head h2{font-size:clamp(32px,3.6vw,48px)!important;font-weight:400!important}
.rd-section-head h2{font-size:clamp(32px,3.6vw,48px)!important}
.card h2,.dataset-page h1,.dataset-list-title,.dataset-card h2{font-weight:400!important}
.rd-eyebrow,.eyebrow,.section-label,.badge{font-size:12px!important;font-weight:400!important;letter-spacing:.035em!important}
.rd-btn,.button,.try,.explore,.product-action{font-size:14px!important;font-weight:400!important}
.rd-brand,.logo,.brand,.footer-brand,.rd-footer-brand{font-weight:500!important}
@media(max-width:600px){.rd-hero h1,.hero h1{font-size:42px!important}.rd-intro h2,.rd-responsible h2,.rd-final h2,.rd-section-head h2{font-size:32px!important}}

</head>
