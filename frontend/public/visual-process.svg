<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Parcours Review Defense</title><desc id="desc">Six étapes d'un dossier, de la réception au suivi.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0a101b"/><stop offset="1" stop-color="#17243a"/></linearGradient></defs><rect width="1600" height="900" rx="56" fill="url(#bg)"/><text x="120" y="130" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#7db4ff">LE PARCOURS</text><text x="120" y="205" font-family="Arial,sans-serif" font-size="58" font-weight="700" fill="#fff">Du signal au suivi.</text><line x1="180" y1="460" x2="1420" y2="460" stroke="#334155" stroke-width="4"/><g font-family="Arial,sans-serif"><g><circle cx="180" cy="460" r="32" fill="#2563eb"/><text x="169" y="468" font-size="18" font-weight="700" fill="#fff">01</text><text x="130" y="535" font-size="24" font-weight="700" fill="#fff">Recevoir</text><text x="130" y="565" font-size="14" fill="#98a2b3">Le signal devient</text><text x="130" y="586" font-size="14" fill="#98a2b3">le point de départ.</text></g><g><circle cx="428" cy="460" r="32" fill="#2563eb"/><text x="417" y="468" font-size="18" font-weight="700" fill="#fff">02</text><text x="378" y="535" font-size="24" font-weight="700" fill="#fff">Qualifier</text><text x="378" y="565" font-size="14" fill="#98a2b3">Établi, disponible</text><text x="378" y="586" font-size="14" fill="#98a2b3">ou à vérifier.</text></g><g><circle cx="676" cy="460" r="32" fill="#2563eb"/><text x="665" y="468" font-size="18" font-weight="700" fill="#fff">03</text><text x="626" y="535" font-size="24" font-weight="700" fill="#fff">Réunir</text><text x="626" y="565" font-size="14" fill="#98a2b3">Captures, documents</text><text x="626" y="586" font-size="14" fill="#98a2b3">et sources utiles.</text></g><g><circle cx="924" cy="460" r="32" fill="#2563eb"/><text x="913" y="468" font-size="18" font-weight="700" fill="#fff">04</text><text x="874" y="535" font-size="24" font-weight="700" fill="#fff">Préparer</text><text x="874" y="565" font-size="14" fill="#98a2b3">Rendre la suite</text><text x="874" y="586" font-size="14" fill="#98a2b3">compréhensible.</text></g><g><circle cx="1172" cy="460" r="32" fill="#132238" stroke="#7db4ff" stroke-width="3"/><text x="1161" y="468" font-size="18" font-weight="700" fill="#7db4ff">05</text><text x="1122" y="535" font-size="24" font-weight="700" fill="#fff">Valider</text><text x="1122" y="565" font-size="14" fill="#98a2b3">Une personne</text><text x="1122" y="586" font-size="14" fill="#98a2b3">décide.</text></g><g><circle cx="1420" cy="460" r="32" fill="#fff"/><text x="1409" y="468" font-size="18" font-weight="700" fill="#101828">06</text><text x="1370" y="535" font-size="24" font-weight="700" fill="#fff">Suivre</text><text x="1370" y="565" font-size="14" fill="#98a2b3">Le dossier reste</text><text x="1370" y="586" font-size="14" fill="#98a2b3">exploitable.</text></g></g><rect x="120" y="710" width="1360" height="1" fill="#334155"/><text x="120" y="765" font-family="Arial,sans-serif" font-size="15" fill="#7db4ff">POINT DE CONTRÔLE</text><text x="120" y="805" font-family="Arial,sans-serif" font-size="23" fill="#fff">La décision sensible intervient après la préparation, pas à la place de celle-ci.</text></svg>