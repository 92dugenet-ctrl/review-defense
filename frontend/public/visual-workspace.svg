ll="#2563eb"/><circle cx="990" cy="630" r="9" fill="#2563eb"/><circle cx="990" cy="695" r="9" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="1020" y="505" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#101828">Reçu</text><text x="1020" y="528" font-family="Arial,sans-serif" font-size="11" fill="#667085">Avis ajouté au dossier</text><text x="1020" y="570" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#101828">Documenté</text><text x="1020" y="593" font-family="Arial,sans-serif" font-size="11" fill="#667085">Éléments rattachés</text><text x="1020" y="635" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#101828">Préparé</text><text x="1020" y="658" font-family="Arial,sans-serif" font-size="11" fill="#667085">Action prête à être examinée</text><text x="1020" y="700" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#2563eb">Validation</text></svg>