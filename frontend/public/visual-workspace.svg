<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Espace de travail Review Defense</title><desc id="desc">Interface abstraite de dossier avec avis, preuves, historique et validation.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#17243a"/></linearGradient><linearGradient id="card" x1="0" x2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eef3fb"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-opacity=".22"/></filter></defs><rect width="1600" height="1000" rx="56" fill="url(#bg)"/><circle cx="1370" cy="120" r="240" fill="#2563eb" opacity=".14"/><rect x="110" y="110" width="1380" height="780" rx="30" fill="#f8fafc" filter="url(#shadow)"/><rect x="110" y="110" width="1380" height="72" rx="30" fill="#101828"/><circle cx="150" cy="146" r="9" fill="#fff"/><text x="180" y="153" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">Review Defense</text><text x="1240" y="153" font-family="Arial,sans-serif" font-size="15" fill="#98a2b3">ESPACE ENTREPRISE</text><rect x="110" y="182" width="250" height="708" fill="#111827"/><text x="145" y="235" font-family="Arial,sans-serif" font-size="12" fill="#7db4ff">DOSSIER</text><text x="145" y="275" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">Avis à examiner</text><rect x="135" y="315" width="200" height="42" rx="8" fill="#263247"/><text x="153" y="342" font-family="Arial,sans-serif" font-size="13" fill="#fff">Analyse</text><text x="153" y="395" font-family="Arial,sans-serif" font-size="13" fill="#aab3c2">Preuves</text><text x="153" y="435" font-family="Arial,sans-serif" font-size="13" fill="#aab3c2">Historique</text><text x="153" y="475" font-family="Arial,sans-serif" font-size="13" fill="#aab3c2">Validation</text><rect x="400" y="220" width="1030" height="130" rx="18" fill="url(#card)" stroke="#