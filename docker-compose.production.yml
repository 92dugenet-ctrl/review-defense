# Déploiement de production sans Caddy intégré : le trafic TLS peut être terminé
# par le proxy ou load balancer externe à cette stack.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: review_defense
      POSTGRES_USER: review_defense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      # Conservation des données même si le conteneur PostgreSQL est remplacé.
      - review_defense_pg:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U review_defense -d review_defense
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REVIEW_DEFENSE_ENV: production
      HOST: 0.0.0.0
      REVIEW_DEFENSE_PUBLIC_BASE_URL: ${REVIEW_DEFENSE_PUBLIC_BASE_URL:?set public URL}
      TRUST_PROXY: "true"
      DATABASE_URL: postgresql://review_defense:${POSTGRES_PASSWORD}@postgres:5432/review_defense
      REVIEW_DEFENSE_MFA_ENCRYPTION_KEY: ${REVIEW_DEFENSE_MFA_ENCRYPTION_KEY:?set MFA key}
      SECURE_HEADERS: "true"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-4}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-60}"
      REVIEW_DEFENSE_RECOVERY_EMAIL_ENABLED: "${REVIEW_DEFENSE_RECOVERY_EMAIL_ENABLED:-false}"
      REVIEW_DEFENSE_REQUIRE_EMAIL_VERIFICATION: "${REVIEW_DEFENSE_REQUIRE_EMAIL_VERIFICATION:-false}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_SENDER: "${SMTP_SENDER:-}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-true}"
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
      REVIEW_DEFENSE_GOOGLE_STATE_KEY: "${REVIEW_DEFENSE_GOOGLE_STATE_KEY:-}"
      REVIEW_DEFENSE_GOOGLE_TOKEN_KEY: "${REVIEW_DEFENSE_GOOGLE_TOKEN_KEY:-}"
      PAYPAL_WEBHOOK_ID: "${PAYPAL_WEBHOOK_ID:-}"
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENV: "${PAYPAL_ENV:-production}"
      REVIEW_DEFENSE_EVIDENCE_ROOT: /data/evidence
    volumes:
      # Stockage persistant des fichiers justificatifs.
      - review_defense_evidence:/data/evidence
    ports:
      # Port hôte configurable, redirigé vers le port interne Gunicorn 8080.
      - "${PORT:-8080}:8080"

volumes:
  review_defense_pg:
  review_defense_evidence:
