name: Review Defense hourly premium maintenance

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: review-defense-hourly-premium
  cancel-in-progress: true

jobs:
  premium-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply bounded premium-site improvements
        continue-on-error: true
        run: python scripts/hourly_premium_maintenance.py

      - name: Install test dependencies
        continue-on-error: true
        run: pip install -r requirements.txt pytest

      - name: Run regression suite
        continue-on-error: true
        run: pytest -q

      - name: Static premium/security audit
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("frontend/landing.html").read_text(encoding="utf-8")
          css = Path("frontend/assets/home.css").read_text(encoding="utf-8")
          checks = {
              "hero_hook": 'rd-home-hero' in p,
              "login_hook": 'id="public-login"' in p,
              "premium_home": 'class="rd-home"' in p,
              "no_googleapis_frontend": "googleapis.com" not in p + css,
              "no_external_google_font_dependency": "fonts.gstatic.com" not in p + css,
              "focus_guardrails": "focus-visible" in css,
          }
          print(checks)
          if not all(checks.values()):
              raise SystemExit("premium/security audit found a regression")
          PY

      - name: Upload hourly audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-premium-maintenance
          path: artifacts/hourly-premium-maintenance.json
          if-no-files-found: ignore
