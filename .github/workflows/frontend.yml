name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - "!frontend/dist/**"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - "!frontend/dist/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
