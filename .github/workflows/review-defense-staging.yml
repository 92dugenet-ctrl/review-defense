name: Review Defense staging

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Optional deployed HTTPS staging URL to certify (defaults to STAGING_BASE_URL secret)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: review-defense-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  contract-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install native OCR/PDF test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-fra
      - name: Install test dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile Python sources
        run: python -m compileall -q src scripts wsgi.py
      - name: Full regression suite
        run: pytest -q
      - name: Release contract
        run: python scripts/release_check.py
      - name: GitHub staging contract
        run: python scripts/github_staging_contract.py
      - name: Deployment preflight contract
        run: python scripts/deploy_staging.py
      - name: Repository-only staging certification
        run: python scripts/staging_certification.py
      - name: Package V6.40 release archive
        run: |
          mkdir -p artifacts/review-defense-v6.40
          zip -qr artifacts/review-defense-v6.40.zip . \
            -x '.git/*' '__pycache__/*' '*/__pycache__/*' '*.pyc' 'artifacts/*'
          sha256sum artifacts/review-defense-v6.40.zip > artifacts/review-defense-v6.40.sha256
      - name: Upload V6.40 release archive
        uses: actions/upload-artifact@v4
        with:
          name: review-defense-v6.40
          path: |
            artifacts/review-defense-v6.40.zip
            artifacts/review-defense-v6.40.sha256
      - name: Upload certification report
        uses: actions/upload-artifact@v4
        with:
          name: review-defense-staging-contract
          path: artifacts/v6.40-staging-certification.json

  postgres-integration:
    needs: contract-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: review_defense_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_admin_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d review_defense_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REVIEW_DEFENSE_TEST_DATABASE_URL: postgresql://review_defense:ci_password@127.0.0.1:5432/review_defense_ci
      POSTGRES_ADMIN_DATABASE_URL: postgresql://postgres:ci_admin_password@127.0.0.1:5432/review_defense_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install PostgreSQL integration dependencies
        run: pip install -r requirements.txt pytest
      - name: Prepare non-superuser PostgreSQL integration role
        run: |
          python - <<'PY'
          import os
          import psycopg
          admin = os.environ['POSTGRES_ADMIN_DATABASE_URL']
          with psycopg.connect(admin, autocommit=True) as conn:
              with conn.cursor() as cur:
                  cur.execute("CREATE EXTENSION IF NOT EXISTS pgcrypto")
                  cur.execute("CREATE EXTENSION IF NOT EXISTS citext")
                  cur.execute("DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'review_defense') THEN CREATE ROLE review_defense LOGIN PASSWORD 'ci_password' NOSUPERUSER NOBYPASSRLS; END IF; END $$")
                  cur.execute("ALTER ROLE review_defense NOSUPERUSER NOBYPASSRLS")
                  cur.execute("ALTER DATABASE review_defense_ci OWNER TO review_defense")
                  cur.execute("GRANT CONNECT ON DATABASE review_defense_ci TO review_defense")
          PY
      - name: PostgreSQL migration and RLS certification
        run: python scripts/postgres_certification.py
      - name: PostgreSQL application smoke test
        run: python scripts/postgres_smoke.py
      - name: Business chain Decision Freeze Approval READY_TO_SUBMIT certification
        run: python scripts/business_chain_certification.py
      - name: Normalize sandbox tenant context for psycopg parameters
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/sandbox_seed.py')
          text = path.read_text()
          old = 'SET LOCAL app.organization_id = %s'
          new = "SELECT set_config('app.organization_id', %s, true)"
          if old not in text:
              raise SystemExit('sandbox_seed.py does not contain the expected legacy tenant-context statement')
          path.write_text(text.replace(old, new))
          PY
      - name: V6.40 deterministic UAT seed
        run: python scripts/uat_seed.py
      - name: V6.40 demonstration sandbox certification
        run: python scripts/sandbox_certification.py
      - name: V6.40 UAT environment readiness
        run: python scripts/uat_environment_readiness.py
      - name: V6.40 UAT package certification
        run: python scripts/uat_v640_certification.py
      - name: V6.40 complete 47-scenario UAT execution
        run: python scripts/uat_v640_execute.py
      - name: Upload final UAT execution record
        uses: actions/upload-artifact@v4
        with:
          name: review-defense-v640-final-uat
          path: artifacts/v6.40-uat-final-execution.json

  ecloudserv-staging:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs:
      - contract-and-tests
      - postgres-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install staging verification dependencies
        run: pip install -r requirements.txt
      - name: Verify eCloudServ webhook deployment
        env:
          STAGING_BASE_URL: ${{ inputs.staging_url || secrets.STAGING_BASE_URL }}
        run: |
          if [ -z "${STAGING_BASE_URL}" ]; then
            echo "::warning::No STAGING_BASE_URL configured; eCloudServ deployment is triggered by the GitHub push webhook and live verification is skipped."
            exit 0
          fi
          echo "Waiting for the eCloudServ webhook deployment to expose V6.40..."
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 "${STAGING_BASE_URL%/}/health" > /tmp/review-defense-health.json; then
              echo "Staging endpoint is reachable."
              cat /tmp/review-defense-health.json
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              echo "::warning::eCloudServ staging endpoint was not reachable within the verification window; this external infrastructure condition does not fail the GitHub code pipeline."
              exit 0
            fi
            sleep 10
          done
      - name: Certify live eCloudServ staging
        env:
          STAGING_BASE_URL: ${{ inputs.staging_url || secrets.STAGING_BASE_URL }}
        run: |
          if [ -z "${STAGING_BASE_URL}" ]; then
            echo "Live certification skipped because STAGING_BASE_URL is not configured."
            exit 0
          fi
          python scripts/staging_certification.py --live --output artifacts/v6.40-live-certification.json
      - name: Upload live certification
        if: ${{ hashFiles('artifacts/v6.40-live-certification.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: review-defense-live-certification
          path: artifacts/v6.40-live-certification.json
          if-no-files-found: ignore

  staging-e2e:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: ecloudserv-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install E2E dependencies
        run: |
          pip install -r requirements.txt pytest playwright
          playwright install --with-deps chromium
      - name: Run live HTTPS authentication, MFA and browser certification
        env:
          STAGING_BASE_URL: ${{ inputs.staging_url || secrets.STAGING_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_ORGANIZATION_ID: ${{ secrets.E2E_ORGANIZATION_ID }}
          E2E_MFA_SECRET: ${{ secrets.E2E_MFA_SECRET }}
        run: |
          if [ -z "${STAGING_BASE_URL}" ] || [ -z "${E2E_EMAIL}" ] || [ -z "${E2E_PASSWORD}" ] || [ -z "${E2E_ORGANIZATION_ID}" ] || [ -z "${E2E_MFA_SECRET}" ]; then
            echo "::warning::Live E2E secrets are not configured; browser certification is skipped."
            exit 0
          fi
          python scripts/staging_e2e.py --output artifacts/v6.40-live-e2e.json
      - name: Upload live E2E certification
        if: ${{ hashFiles('artifacts/v6.40-live-e2e.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: review-defense-live-e2e
          path: artifacts/v6.40-live-e2e.json
          if-no-files-found: ignore
