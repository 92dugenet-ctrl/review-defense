name: Review Defense staging

# Deployment trigger: keep eCloudServ synchronized with the main branch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Optional deployed HTTPS staging URL to certify (defaults to STAGING_BASE_URL secret)'
        required: false
        type: string

permissions:
  contents: read

auto_placeholder: true