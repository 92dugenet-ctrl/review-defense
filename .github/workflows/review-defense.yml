name: Review Defense — backend and new frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Python compile check
        run: python -m compileall -q src wsgi.py main.py start.py
      - name: Backend and new frontend tests
        run: pytest -q
      - name: Frontend JavaScript syntax
        run: node --check frontend/assets/public.js
