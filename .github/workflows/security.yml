name: Review Defense — security
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q src scripts wsgi.py main.py start.py
      - name: Security tests
        run: python -m pytest -q tests/test_security.py
