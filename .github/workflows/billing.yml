name: Review Defense — billing
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  billing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src scripts wsgi.py main.py start.py
      - run: python -m pytest -q tests/test_billing.py tests/test_processing_jobs.py tests/test_security.py tests/test_business_api_contract.py tests/test_foundation.py
