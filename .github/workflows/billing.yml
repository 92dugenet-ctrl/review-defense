name: Review Defense — production verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: review_defense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d review_defense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run typecheck
          npm run build
      - run: python -m pip install -r requirements.txt
      - name: Build deployable production image
        run: |
          docker build --pull -t review-defense:${GITHUB_SHA} .
          docker run --rm --entrypoint sh review-defense:${GITHUB_SHA} -c '
            test -f /app/frontend/dist/index.html
            test -f /app/wsgi.py
            python -m compileall -q /app/src /app/scripts /app/wsgi.py
          '
      - run: python -m compileall -q src scripts wsgi.py main.py start.py
      - name: Apply migrations and create integration role
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/review_defense
        run: |
          DATABASE_URL="$ADMIN_DATABASE_URL" python scripts/migrate.py
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["ADMIN_DATABASE_URL"], autocommit=True) as conn:
              conn.execute("CREATE ROLE review_defense_app LOGIN PASSWORD 'review_defense_app' NOSUPERUSER NOCREATEDB NOCREATEROLE")
              conn.execute("GRANT USAGE ON SCHEMA public TO review_defense_app")
              conn.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO review_defense_app")
              conn.execute("GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO review_defense_app")
              conn.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO review_defense_app")
          PY
      - name: Production configuration contract
        env:
          REVIEW_DEFENSE_ENV: production
          HOST: 0.0.0.0
          REVIEW_DEFENSE_PUBLIC_BASE_URL: https://example.test
          TRUST_PROXY: "true"
          DATABASE_URL: postgresql://review_defense_app:review_defense_app@localhost:5432/review_defense
          REVIEW_DEFENSE_MFA_ENCRYPTION_KEY: "01234567890123456789012345678901"
        run: python scripts/production_check.py
      - name: Full integration and production operations
        env:
          DATABASE_URL: postgresql://review_defense_app:review_defense_app@localhost:5432/review_defense
        run: python -m pytest -q tests/test_integration.py tests/test_production_operations.py
      - name: Full regression suite
        run: python -m pytest -q tests/test_billing.py tests/test_processing_jobs.py tests/test_security.py tests/test_business_api_contract.py tests/test_foundation.py
