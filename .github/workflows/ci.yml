name: CI

on:
  push:
    branches: [develop]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: review_defense
          POSTGRES_USER: review_defense
          POSTGRES_PASSWORD: review_defense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review_defense -d review_defense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://review_defense:review_defense_test@localhost:5432/review_defense
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply database migrations
        run: python scripts/migrate.py
      - name: Check client workspace JavaScript syntax
        run: node --check frontend/workspace.js
      - name: Check application JavaScript syntax
        run: node --check frontend/assets/app.js
      - name: Run client hub tests
        run: python -m pytest -q tests/test_client_monitoring_hub.py
      - name: Run full test suite
        run: python -m pytest -q
