name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: review_defense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d review_defense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/review_defense
        run: DATABASE_URL="$DATABASE_URL" python scripts/migrate.py
      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/review_defense
        run: python -m pytest -q
